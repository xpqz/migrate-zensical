# The repository's one Python environment: the Zensical build stack, the
# conversion and check tooling under tools/, its tests, and the deploy tool.
#   uv sync                 build + tooling, plus pytest and the CHM build
#                           dependencies (the default groups, dev and chm)
#   uv sync --all-groups    also mike (deploy)
#
# The project itself packages tools/dyalog_caption.py and tools/dyalog_vars.py:
# Python-Markdown imports these extensions by module name when Zensical builds,
# so they must be installed, not merely on a test path.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dyalog-docs-tooling"
version = "0.1.0"
description = "Build and maintenance tooling for the Dyalog documentation on Zensical."
requires-python = ">=3.14"
dependencies = [
    # The static site generator, pinned: tools/build_gate.py parses its
    # diagnostic output, which is not a stability contract.
    "zensical==0.1.1",
    # Python-Markdown extensions named in zensical.toml's markdown_extensions
    # (admonition, attr_list, footnotes, md_in_html and toc are built-ins).
    "pymdown-extensions==12.0.1",
    "markdown-tables-extended==0.1.3",
    # tools/cutover/convert.py: reads mkdocs.yml, writes zensical.toml, rewrites raw HTML.
    "pyyaml",
    "beautifulsoup4==4.15.0",
    "tomli-w==1.2.0",
]

[dependency-groups]
dev = ["pytest==9.2.0"]
# mike: the squidfunk fork that builds with Zensical rather than MkDocs, pinned
# to a commit because it is distributed from GitHub only. `mike deploy <ver>`
# runs `zensical build` and writes the gh-pages version layout the theme's
# version selector reads.
deploy = [
    "mike @ git+https://github.com/squidfunk/mike.git@2d4ad799442f4592db8ad53b179bfb33db8c69ac",
]
# tools/chm/build_chm.py: renders pages itself with Pygments highlighting (a
# CHM has no client-side highlighter), and trims and minifies each page's
# inlined CSS and HTML. Versions as in the documentation repository's
# tools/requirements-docs.txt.
chm = [
    "pygments",  # also a Zensical dependency; its version is resolved there
    "cssutils==2.15.0",
    # htmlmin2: htmlmin 0.1.12 minus its `import cgi` (removed in Python 3.13);
    # otherwise identical, so the CHM output is unchanged.
    "htmlmin2==0.1.13",
    "csscompressor==0.9.5",
]

[tool.uv]
# A plain `uv sync` installs these, so the CHM tests run rather than skip.
default-groups = ["dev", "chm"]

[tool.setuptools]
py-modules = ["dyalog_caption", "dyalog_vars"]
package-dir = { "" = "tools" }

[tool.pytest.ini_options]
testpaths = ["tools"]
# tools/cutover/ holds the conversion and cutover scripts, which import each
# other by module name; it is deleted after the cutover.
pythonpath = ["tools", "tools/cutover"]
