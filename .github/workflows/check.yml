name: Check

# Runs the test suite and the content checks on every pull request and on
# pushes to main. The platforms job runs the same tests and checks (which
# build the site) on Windows and macOS, weekly and on demand, since the
# day-to-day checks only run on Linux.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The house style is a submodule under the project's docs/.
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install all dependency groups
        # The Python version comes from .python-version, the pins from uv.lock.
        # All groups, so the CHM tests run instead of being skipped.
        run: uv sync --all-groups --locked

      - name: Tests
        run: uv run pytest -q

      - name: Content checks and build
        run: uv run python tools/check.py

      - name: Offline bundle
        # Builds the bundle chm.yml releases and proves it loads with no
        # network; the installers' own tests ran with the others above.
        run: |
          uv run python tools/offline/build_bundle.py --out out/offline --git-info "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}:${GITHUB_SHA::8}"
          uv run playwright install --with-deps chromium
          mkdir -p out/offline-site
          tar -xzf out/offline/dyalog-docs-*.tar.gz -C out/offline-site
          OFFLINE_SITE="$(echo "$PWD"/out/offline-site/dyalog-docs-*)" \
            uv run pytest -q tools/offline/test_offline_site.py

  platforms:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Install all dependency groups
        run: uv sync --all-groups --locked

      - name: Tests
        run: uv run pytest -q

      - name: Content checks and build
        # check.py runs the Zensical build, so this also covers the build.
        run: uv run python tools/check.py
